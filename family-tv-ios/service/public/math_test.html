<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>休息一下 · 电视时间</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Noto Sans CJK SC",sans-serif;background:#090b10;color:#f5f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:4vh 5vw}main{width:min(1100px,90vw);display:grid;grid-template-columns:1fr 440px;gap:70px;align-items:center}.eyebrow{color:#98a9c6;font-size:20px;letter-spacing:.1em}h1{font-size:52px;font-weight:500;margin:22px 0}p{font-size:23px;line-height:1.7;color:#bac4d6}.question{font-size:64px;font-weight:500;margin:38px 0 20px;font-variant-numeric:tabular-nums}.answer{height:88px;border-bottom:2px solid #697da1;font-size:50px;letter-spacing:.1em;min-width:200px}.progress{display:flex;gap:14px;margin:30px 0}.dot{width:26px;height:26px;border-radius:50%;background:#303b50}.dot.done{background:#92e9c1}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}button{font:inherit;font-size:34px;min-height:92px;border:2px solid transparent;border-radius:18px;color:#f4f7ff;background:#202838;cursor:pointer;transition:transform .12s,background .12s}button:focus-visible,button:focus{outline:4px solid #e4efff;outline-offset:4px;background:#3a4b68;transform:scale(1.04)}button.action{font-size:24px;background:#304a65}button:disabled{opacity:.45}.wide{grid-column:span 3;font-size:23px}.message{min-height:74px;font-size:22px;color:#a8dfd5}.hint{font-size:18px;color:#8291aa}.success{color:#92e9c1}@media(max-width:900px){main{grid-template-columns:1fr;gap:10px}h1{font-size:32px;margin:10px 0}.question{font-size:40px;margin:10px 0}.answer{height:54px;font-size:32px}button{min-height:55px;font-size:25px}.progress{margin:12px 0}p{font-size:18px}.keys{gap:12px}}@media(prefers-reduced-motion:reduce){button{transition:none}}
@media(max-height:700px){body{padding:16px 4vw}main{width:92vw;max-width:1160px;grid-template-columns:minmax(0,1fr) minmax(280px,420px);gap:38px}.eyebrow{font-size:16px}h1{font-size:32px;line-height:1.2;margin:10px 0}p{font-size:16px;line-height:1.4;margin:8px 0}.question{font-size:42px;line-height:1.2;margin:12px 0 8px}.answer{height:50px;font-size:36px}.progress{margin:14px 0}.dot{width:18px;height:18px}.message{font-size:16px;min-height:45px}.hint{display:none}.keys{gap:10px}button{min-height:58px;border-radius:13px;font-size:26px}button.action{font-size:19px}button.wide{min-height:42px;font-size:17px}}
#displayPanel{overflow-wrap:anywhere;width:90vw;max-width:1250px}#displayPanel[hidden],main[hidden]{display:none}#displayBullets{font-size:24px;line-height:1.7}#displayHeading{font-size:42px}#choices{font-size:18px;display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;padding-left:24px;margin:8px 0}#choices[hidden]{display:none}body.choice-mode .question{font-size:30px;margin:12px 0}#restNotice{position:fixed;top:2vh;left:4vw;right:4vw;color:#c5d6ed;font-size:20px;line-height:1.5} @media(max-height:700px){#restNotice{font-size:15px;top:14px}}
</style>
</head>
<body>
<aside id="restNotice" hidden role="status"></aside>
<section id="displayPanel" hidden aria-label="家长安排的展示"><div class="eyebrow" id="displayTitle"></div><h1 id="displayHeading"></h1><p id="displayBody"></p><ul id="displayBullets"></ul><p class="hint">左右键翻页 · 家长可在后台结束展示 · 系统主页键仍由电视控制</p><p id="displayPage"></p></section>
<main>
<section>
<div class="eyebrow">电视时间 · 休息与挑战</div>
<h1 id="heading">连接电视时间服务</h1>
<p id="intro">完成挑战后可继续观看，题型与时长由家长设置。</p>
<div id="progress" class="progress" aria-label="连续答对0题"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
<div id="question" class="question" aria-live="polite">请稍候…</div>
<ol id="choices" hidden></ol>
<div id="answer" class="answer" aria-label="当前输入">＿</div>
<p id="message" class="message" role="status" aria-live="polite"></p>
<p class="hint">方向键选择数字 · 确认键输入 · 系统主页键由电视系统处理</p>
</section>
<section class="keys" aria-label="答题数字键盘">
<button data-row="0" data-col="0" data-digit="1">1</button><button data-row="0" data-col="1" data-digit="2">2</button><button data-row="0" data-col="2" data-digit="3">3</button>
<button data-row="1" data-col="0" data-digit="4">4</button><button data-row="1" data-col="1" data-digit="5">5</button><button data-row="1" data-col="2" data-digit="6">6</button>
<button data-row="2" data-col="0" data-digit="7">7</button><button data-row="2" data-col="1" data-digit="8">8</button><button data-row="2" data-col="2" data-digit="9">9</button>
<button data-row="3" data-col="0" id="erase" class="action">删除</button><button data-row="3" data-col="1" data-digit="0">0</button><button data-row="3" data-col="2" id="submit" class="action">确认</button>
<button data-row="4" data-col="1" id="retry" class="wide">重新连接／重试领取</button>
</section>
</main>
<script>
'use strict';
// 单文件无第三方脚本、无外部字体/CDN；由服务端和Nginx生成此内联脚本的CSP哈希。
const ORIGIN='https://tv.example.com';
const $=id=>document.getElementById(id);
let digits='',question=null,csrf='',readyNonce=null,locked=false,busy=false,polling=false,submitted=null,adultMode=false,pendingSubmit=false;
const buttons=[...document.querySelectorAll('button')];
buttons.forEach(b=>b.tabIndex=-1);
function focus(button){buttons.forEach(b=>b.tabIndex=b===button?0:-1);button.focus();}
function setInput(value){digits=value;$('answer').textContent=digits||'＿';}
function progress(n){[...$('progress').children].forEach((d,i)=>d.classList.toggle('done',i<n));$('progress').setAttribute('aria-label','连续答对'+n+'题');}
function bypass(message){displayDocument=null;$('displayPanel').hidden=true;document.querySelector('main').hidden=false;locked=false;$('heading').textContent='暂时无法连接';$('message').textContent=message+'；本地策略为放行，可按返回或主页键离开。';}
async function api(path,body){
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),4500);
  try{
    const response=await fetch(path,{method:body?'POST':'GET',credentials:'same-origin',cache:'no-store',signal:ctrl.signal,
      headers:body?{'Content-Type':'application/json','X-CSRF-Token':csrf}:{},body:body?JSON.stringify(body):undefined});
    const data=await response.json();
    if(!response.ok){const e=new Error(data.error||'服务暂不可用');e.status=response.status;throw e;}
    return data;
  }finally{clearTimeout(timer);}
}
let displayDocument=null,displayPage=0;
function renderDisplay(){const doc=displayDocument,page=doc.pages[displayPage];$('displayTitle').textContent=doc.title;$('displayHeading').textContent=page.heading;$('displayBody').textContent=page.body;$('displayBullets').replaceChildren(...(page.bullets||[]).map(text=>{const li=document.createElement('li');li.textContent=text;return li;}));$('displayPage').textContent=(displayPage+1)+' / '+doc.pages.length;}
function showQuestion(q){
 $('question').textContent=q?.text||'正在准备题目…';const list=$('choices');list.replaceChildren();const choices=q?.choices||[];list.hidden=!choices.length;document.body.classList.toggle('choice-mode',!!choices.length);
 choices.forEach(text=>{const li=document.createElement('li');li.textContent=text;list.append(li);});if(choices.length)$('message').textContent='输入选项序号，再按确认。';
}
function showState(state){
  csrf=state.csrf||csrf;
  if(state.display){if(displayDocument?.id!==state.display.id)displayPage=0;displayDocument=state.display;locked=false;$('restNotice').hidden=true;document.querySelector('main').hidden=true;$('displayPanel').hidden=false;renderDisplay();return;}
  displayDocument=null;$('displayPanel').hidden=true;document.querySelector('main').hidden=false;locked=state.status==='lock';readyNonce=state.ready_nonce||null;
  const nextAdult=state.lock_reason==='restricted_time';if(nextAdult!==adultMode){setInput('');question=null;}adultMode=nextAdult;
  $('erase').textContent=adultMode?'清空':'删除';
  $('restNotice').hidden=!locked;
  if(locked && state.rest_until_ms){
    const time=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(state.rest_until_ms));
    $('restNotice').textContent='休息一下，建议 '+time+' 之后再来吧（连续休息 '+Math.round(state.rest_reset_seconds/3600*10)/10+' 小时后恢复初始额度）';
  }
  if(locked&&!state.rest_until_ms)$('restNotice').textContent='休息一下，当前时段禁止观看；如需临时放行请成人确认。';
  $('intro').textContent=adultMode?'当前为禁止观看时段，请成人输入北京时间的年月日时分（12位数字）。验证后临时放行 '+Math.round((state.adult_grant_seconds||1800)/60)+' 分钟。':'连续答对三道题，可再观看 '+Math.round((state.next_reward_seconds||1200)/60)+' 分钟。答错会重新开始。';
  progress(state.streak||0);
  if(!locked){showQuestion(null);question=null;$('intro').textContent='当前还可观看 '+Math.round((state.remaining_seconds||0)/60)+' 分钟。请按提示安排休息。';$('heading').textContent='可以继续观看了';$('question').textContent='当前可继续观看 ✓';$('message').textContent='可按返回键或主页键回到视频；返回行为取决于电视浏览器。';return;}
  $('heading').textContent=adultMode?'请成人确认':'休息一下，动动脑';
  if(adultMode){showQuestion({text:'YYYYMMDDHHmm'});$('progress').hidden=true;return;}
  $('progress').hidden=false;
  if(state.question && state.question.id!==question?.id){question=state.question;setInput('');}
  showQuestion(readyNonce?{text:'三题完成 ✓'}:question);
}
async function poll(){
  if(polling||busy)return;polling=true;
  try{showState(await api('/lock_status'));}
  catch(e){bypass(e.status===401?'答题会话已过期，请返回视频后重新进入':e.message);}
  finally{polling=false;if(pendingSubmit){pendingSubmit=false;submit();}}
}
async function unlock(){
  const nonce=readyNonce;if(!nonce)return;
  const result=await api('/unlock',{nonce});
  showState({...result,streak:0});
  $('message').textContent='已获得 '+Math.round((result.credited_seconds||0)/60)+' 分钟。可按返回键或主页键回到视频。';
}
async function submit(){
  if(busy||!locked)return;
  if(polling){pendingSubmit=true;return;}
  busy=true;
  try{
    if(adultMode){
      if(digits.length!==12){$('message').textContent='请输入12位年月日时分数字。';return;}
      const key='adult:'+digits;if(submitted?.key!==key)submitted={key,id:crypto.randomUUID()};
      const result=await api('/adult_verify',{code:digits,attempt_id:submitted.id});showState(result);
      $('message').textContent='成人确认通过，已临时放行 '+Math.round(result.granted_seconds/60)+' 分钟。';submitted=null;setInput('');return;
    }
    if(readyNonce){await unlock();return;}
    if(!question||!digits){$('message').textContent='请先输入答案。';return;}
    // 相同题目、相同答案重试复用attempt_id，网络超时也不会重复推进题目。
    const value=Number(digits),key=question.id+':'+digits;
    if(submitted?.key!==key)submitted={key,id:crypto.randomUUID()};
    const result=await api('/answer',{question_id:question.id,answer:value,attempt_id:submitted.id});
    progress(result.streak);readyNonce=result.ready_nonce;question=result.question;setInput('');submitted=null;
    showQuestion(readyNonce?{text:'三题完成 ✓'}:question);
    $('message').textContent=result.correct?'答对了，继续！':'这题答错了，连续计数归零，再试一次。';
    if(readyNonce)await unlock();
  }catch(e){
    if(e.status===409){question=null;$('message').textContent='题目状态已更新，请稍候重新加载。';}
    else $('message').textContent=e.message+'，可选择“重新连接／重试领取”。';
  }finally{busy=false;}
}
buttons.forEach(button=>button.addEventListener('click',()=>{
  focus(button);
  if(button.dataset.digit!==undefined){if(locked&&!busy&&digits.length<(adultMode?12:3))setInput(digits+button.dataset.digit);}
  else if(button.id==='erase')setInput(adultMode?'':digits.slice(0,-1));
  else if(button.id==='submit')submit();
  else if(button.id==='retry'){if(readyNonce)submit();else poll();}
}));
window.addEventListener('keydown',event=>{
  if(displayDocument&&['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();displayPage=Math.max(0,Math.min(displayDocument.pages.length-1,displayPage+(event.key==='ArrowRight'?1:-1)));renderDisplay();return;}
  // 只能拦截实际送达网页的按键，不能控制Android Home、电源、浏览器原生返回或系统设置。
  if(locked && ([4,82,461,10009].includes(event.keyCode)||['BrowserBack','ContextMenu','Escape'].includes(event.key))){event.preventDefault();event.stopPropagation();return;}
  const b=document.activeElement;
  if(event.key.startsWith('Arrow')){
    event.preventDefault();let row=Number(b?.dataset.row??1),col=Number(b?.dataset.col??1);
    const dr=event.key==='ArrowDown'?1:event.key==='ArrowUp'?-1:0,dc=event.key==='ArrowRight'?1:event.key==='ArrowLeft'?-1:0;
    const target=buttons.filter(x=>Number(x.dataset.row)===row+dr).sort((a,b)=>Math.abs(Number(a.dataset.col)-(col+dc))-Math.abs(Number(b.dataset.col)-(col+dc)))[0];
    if(target)focus(target);return;
  }
  if(/^\d$/.test(event.key)&&locked&&!busy){event.preventDefault();if(digits.length<(adultMode?12:3))setInput(digits+event.key);}
  if(event.key==='Backspace'&&locked){event.preventDefault();setInput(digits.slice(0,-1));}
},true);
async function start(){
  if(location.origin!==ORIGIN){bypass('站点域名不匹配');return;}
  // 票据在fragment，服务器访问日志/Referer不会收到它；读取后立即从地址栏清除。
  const ticket=new URLSearchParams(location.hash.slice(1)).get('ticket');
  history.replaceState(null,'',location.pathname);
  try{if(ticket)await api('/bootstrap',{ticket});await poll();}
  catch(e){bypass(e.message);}
  focus(buttons[4]);setInterval(poll,2000);
}
start();
</script>
</body>
</html>
