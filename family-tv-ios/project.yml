name: FamilyTV
options:
  developmentLanguage: zh-Hans
  bundleIdPrefix: wang.chengkai
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: C5792GBPNR
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 4
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  FamilyTV:
    type: application
    platform: iOS
    sources: [App, Core, Resources]
    info:
      path: AppInfo.plist
      properties:
        FamilyTVServiceOrigin: $(FAMILYTV_SERVICE_ORIGIN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: wang.chengkai.familytv
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 观有度
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          FAMILYTV_SERVICE_ORIGIN: https://tv.chengkai.wang
        Release:
          FAMILYTV_SERVICE_ORIGIN: https://familytv-api.princewck.workers.dev
  FamilyTVTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [FamilyTV.storekit]
      - path: Tests/FamilyTV.storekit
        buildPhase: resources
    dependencies:
      - target: FamilyTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  FamilyTVUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: FamilyTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FamilyTV:
    run:
      storeKitConfiguration: Tests/FamilyTV.storekit
    build:
      targets:
        FamilyTV: all
    test:
      targets: [FamilyTVTests, FamilyTVUITests]
